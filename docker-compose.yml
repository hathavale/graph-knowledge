services:
  neo4j:
    image: neo4j:5-community
    container_name: graph-knowledge-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}"
      # Keep the JVM small; this is a laptop, not a server.
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache__size: 512m
      # Query logging is ON by default in 5.x and writes to disk continuously.
      NEO4J_db_logs_query_enabled: "OFF"
    volumes:
      # Bind mounts, NOT named volumes: data lives on the host filesystem where
      # `du -sh` can see it and `cp -r` backs it up. It does not inflate Docker.raw,
      # and `docker system prune --volumes` cannot destroy it.
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
    logging:
      # Without this, a container's JSON log grows unbounded until the VM fills.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
