[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-knowledge"
version = "0.1.0"
description = "Build a knowledge graph of people, places and activities from free text"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "neo4j>=5.0",
]

[project.optional-dependencies]
embedded = ["ladybug>=0.20"]
dev = ["pytest>=7.0"]

[project.scripts]
graph-knowledge = "graph_knowledge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
